package:
  name: cva6
  authors:
    - "Florian Zaruba <zarubaf@iis.ee.ethz.ch>"
    - "Michael Schaffner <schaffner@iis.ee.ethz.ch>"
    - "Andreas Kuster <kustera@ethz.ch>"

# WT_DCACHE
dependencies:
  axi: { git: "https://github.com/pulp-platform/axi.git", version: 0.31.0 }
  common_cells:
    { git: "https://github.com/pulp-platform/common_cells", version: 1.23.0 }
  fpnew: { git: "https://github.com/openhwgroup/cvfpu.git", rev: 3eb6afe } # branch: develop
  tech_cells_generic:
    { git: "https://github.com/pulp-platform/tech_cells_generic.git", version: 0.2.13 }

export_include_dirs:
  - design/include
  - ip/hpdcache/rtl/include
  - ip/hpdcache/rtl/src/utils/ecc

sources:
  - include_dirs:
      - design/include
    files:
      - design/include/config_pkg.sv
      # Pick the right configuration by passing the right bender flag.
      - target: cv64a6_imafdcv_sv39
        files:
          - design/cfg/cv64a6_imafdcv_sv39_config_pkg.sv

      - target: cv64a6_imafdc_sv39
        files:
          - design/cfg/cv64a6_imafdc_sv39_config_pkg.sv

      - target: cv64a6_imafdc_sv39_wb
        files:
          - design/cfg/cv64a6_imafdc_sv39_wb_config_pkg.sv

      - target: cv64a6_imafdc_sv39_hpdcache
        files:
          - design/cfg/cv64a6_imafdc_sv39_hpdcache_config_pkg.sv

      - target: cv64a6_imafdc_sv39_hpdcache_wb
        files:
          - design/cfg/cv64a6_imafdc_sv39_hpdcache_wb_config_pkg.sv

      - target: cv64a6_imafdch_sv39
        files:
          - design/cfg/cv64a6_imafdch_sv39_config_pkg.sv

      - target: cv64a6_imafdch_sv39_wb
        files:
          - design/cfg/cv64a6_imafdch_sv39_wb_config_pkg.sv

      - target: cv32a6_imac_sv0
        files:
          - design/cfg/cv32a6_imac_sv0_config_pkg.sv

      - target: cv32a6_imac_sv32
        files:
          - design/cfg/cv32a6_imac_sv32_config_pkg.sv

      - target: cv32a6_imafc_sv32
        files:
          - design/cfg/cv32a6_imafc_sv32_config_pkg.sv

      - target: cv32a60x
        files:
          - design/cfg/cv32a60x_config_pkg.sv

      - target: cv32a65x
        files:
          - design/cfg/cv32a65x_config_pkg.sv

      - target: cv64a60ax_cvfpu_uvm
        files:
          - design/cfg/cv64a60ax_config_pkg_cvfpu-uvm.sv

      # General config infrastructure
      - design/include/cva6dx_riscv_pkg.sv
      - design/include/cva6dx_pkg.sv
      - design/include/build_config_pkg.sv

      - target: not(exclude_first_pass_decoder)
        files:
          - design/decode/cva6dx_accel_first_pass_decoder.sv

      # MMU
      - target: any(cv64a6_imafdcv_sv39, cv64a6_imafdc_sv39, cv64a6_imafdc_sv39_wb, cv64a6_imafdch_sv39, cv64a6_imafdc_sv39_hpdcache, cv64a6_imafdc_sv39_hpdcache_wb, cv64a6_imafdch_sv39_wb, cv32a6_imac_sv0, cv32a6_imac_sv32, cv32a6_imafc_sv32)
        files:
          - design/mmu/cva6dx_tlb.sv
          - design/mmu/cva6dx_shared_tlb.sv
          - design/mmu/cva6dx_mmu.sv
          - design/mmu/cva6dx_ptw.sv

      # Packages
      - design/include/dummy_l15_pkg.sv
      - design/include/cva6dx_wt_cache_pkg.sv
      - design/include/cva6dx_std_cache_pkg.sv
      - design/include/cva6dx_aes_pkg.sv

      # Extension Interface
      - examples/cvxif/include/cvxif_instr_pkg.sv
      - design/cvxif/cva6dx_cvxif_fu.sv
      - design/cvxif/cva6dx_cvxif_issue_register_commit_if_driver.sv
      - design/cvxif/cva6dx_cvxif_compressed_if_driver.sv
      - examples/cvxif/cvxif_example_coprocessor.sv
      - examples/cvxif/instr_decoder.sv

      # Tracing
      - design/rvfi/cva6dx_rvfi_probes.sv
      - design/prim/cva6dx_fifo_v3.sv
      # Top-level source files (not necessarily instantiated at the top of the cva6).
      - design/cva6dx_core.sv
      - design/execute/cva6dx_aes.sv
      - design/execute/cva6dx_alu.sv
      - design/execute/cva6dx_alu_wrapper.sv
      - design/execute/cva6dx_fpu_wrap.sv # depends on fpnew_pkg, above
      - design/execute/cva6dx_branch_unit.sv
      - design/decode/cva6dx_compressed_decoder.sv
      - design/commit/cva6dx_controller.sv
      - design/execute/cva6dx_csr_buffer.sv
      - design/csr/cva6dx_csr_regfile.sv
      - design/decode/cva6dx_decoder.sv
      - design/execute/cva6dx_ex_stage.sv
      - design/cvxif/cva6dx_acc_dispatcher.sv
      - design/frontend/cva6dx_instr_realign.sv
      - design/decode/cva6dx_id_stage.sv
      - design/issue/cva6dx_issue_read_operands.sv
      - design/issue/cva6dx_issue_stage.sv
      - design/lsu/cva6dx_load_unit.sv
      - design/lsu/cva6dx_lsu.sv
      - design/lsu/cva6dx_lsu_bypass.sv
      - design/execute/cva6dx_mult.sv
      - design/execute/cva6dx_multiplier.sv
      - design/execute/cva6dx_serdiv.sv
      - design/pmu/cva6dx_perf_counters.sv
      - design/issue/cva6dx_regfile_ff.sv
      - design/issue/cva6dx_regfile_fpga.sv
      - design/issue/cva6dx_scoreboard.sv
      - design/issue/cva6dx_raw_checker.sv
      - design/lsu/cva6dx_store_buffer.sv
      - design/lsu/cva6dx_amo_buffer.sv
      - design/lsu/cva6dx_store_unit.sv
      - design/commit/cva6dx_commit_stage.sv
      - design/cache/cva6dx_axi_shim.sv

      # Frontend (i.e., fetch, decode, dispatch)
      - design/frontend/cva6dx_btb.sv
      - design/frontend/cva6dx_bht.sv
      - design/frontend/cva6dx_bht2lvl.sv
      - design/frontend/cva6dx_ras.sv
      - design/frontend/cva6dx_instr_scan.sv
      - design/frontend/cva6dx_instr_queue.sv
      - design/frontend/cva6dx_frontend.sv
      # Cache subsystem(s)
      - design/cache/cva6dx_wt_dcache_ctrl.sv
      - design/cache/cva6dx_wt_dcache_mem.sv
      - design/cache/cva6dx_wt_dcache_missunit.sv
      - design/cache/cva6dx_wt_dcache_wbuffer.sv
      - design/cache/cva6dx_wt_dcache.sv
      - design/cache/cva6dx_wt_cache_subsystem.sv
      - design/cache/cva6dx_wt_axi_adapter.sv
      - design/cache/cva6dx_icache.sv
      - design/cache/cva6dx_tag_cmp.sv
      - design/cache/cva6dx_icache_axi_wrapper.sv
      - design/cache/cva6dx_axi_adapter.sv
      - design/cache/cva6dx_miss_handler.sv
      - design/cache/cva6dx_axi_adapter_arbiter.sv
      - design/cache/cva6dx_cache_ctrl.sv
      - design/cache/cva6dx_std_nbdcache.sv
      - design/cache/cva6dx_std_cache_subsystem.sv
      # HPDCache sources
      - ip/hpdcache/rtl/src/hpdcache_pkg.sv
      - ip/hpdcache/rtl/src/utils/hpdcache_mem_resp_demux.sv
      - ip/hpdcache/rtl/src/utils/hpdcache_mem_to_axi_read.sv
      - ip/hpdcache/rtl/src/utils/hpdcache_mem_to_axi_write.sv
      - ip/hpdcache/rtl/src/utils/hpdcache_mem_req_read_arbiter.sv
      - ip/hpdcache/rtl/src/utils/hpdcache_mem_req_write_arbiter.sv
      - ip/hpdcache/rtl/src/common/hpdcache_demux.sv
      - ip/hpdcache/rtl/src/common/hpdcache_lfsr.sv
      - ip/hpdcache/rtl/src/common/hpdcache_sync_buffer.sv
      - ip/hpdcache/rtl/src/common/hpdcache_fifo_reg.sv
      - ip/hpdcache/rtl/src/common/hpdcache_fifo_reg_initialized.sv
      - ip/hpdcache/rtl/src/common/hpdcache_fxarb.sv
      - ip/hpdcache/rtl/src/common/hpdcache_rrarb.sv
      - ip/hpdcache/rtl/src/common/hpdcache_mux.sv
      - ip/hpdcache/rtl/src/common/hpdcache_decoder.sv
      - ip/hpdcache/rtl/src/common/hpdcache_1hot_to_binary.sv
      - ip/hpdcache/rtl/src/common/hpdcache_prio_1hot_encoder.sv
      - ip/hpdcache/rtl/src/common/hpdcache_prio_bin_encoder.sv
      - ip/hpdcache/rtl/src/common/hpdcache_sram.sv
      - ip/hpdcache/rtl/src/common/hpdcache_sram_wbyteenable.sv
      - ip/hpdcache/rtl/src/common/hpdcache_sram_wmask.sv
      - ip/hpdcache/rtl/src/common/hpdcache_regbank_wbyteenable_1rw.sv
      - ip/hpdcache/rtl/src/common/hpdcache_regbank_wmask_1rw.sv
      - ip/hpdcache/rtl/src/common/hpdcache_data_downsize.sv
      - ip/hpdcache/rtl/src/common/hpdcache_data_upsize.sv
      - ip/hpdcache/rtl/src/common/hpdcache_data_resize.sv
      - ip/hpdcache/rtl/src/hwpf_stride/hwpf_stride_pkg.sv
      - ip/hpdcache/rtl/src/hwpf_stride/hwpf_stride.sv
      - ip/hpdcache/rtl/src/hwpf_stride/hwpf_stride_arb.sv
      - ip/hpdcache/rtl/src/hwpf_stride/hwpf_stride_wrapper.sv
      - ip/hpdcache/rtl/src/hpdcache.sv
      - ip/hpdcache/rtl/src/hpdcache_amo.sv
      - ip/hpdcache/rtl/src/hpdcache_cmo.sv
      - ip/hpdcache/rtl/src/hpdcache_core_arbiter.sv
      - ip/hpdcache/rtl/src/hpdcache_ctrl.sv
      - ip/hpdcache/rtl/src/hpdcache_ctrl_pe.sv
      - ip/hpdcache/rtl/src/hpdcache_memctrl.sv
      - ip/hpdcache/rtl/src/hpdcache_miss_handler.sv
      - ip/hpdcache/rtl/src/hpdcache_mshr.sv
      - ip/hpdcache/rtl/src/hpdcache_rtab.sv
      - ip/hpdcache/rtl/src/hpdcache_uncached.sv
      - ip/hpdcache/rtl/src/hpdcache_victim_plru.sv
      - ip/hpdcache/rtl/src/hpdcache_victim_random.sv
      - ip/hpdcache/rtl/src/hpdcache_victim_sel.sv
      - ip/hpdcache/rtl/src/hpdcache_wbuf.sv
      - ip/hpdcache/rtl/src/hpdcache_flush.sv
      - ip/hpdcache/rtl/src/hpdcache_cbuf.sv
      # HPDCache integration
      - design/cache/cva6dx_hpdcache_if_adapter.sv
      - design/cache/cva6dx_hpdcache_subsystem_axi_arbiter.sv
      - design/cache/cva6dx_hpdcache_subsystem.sv
      - design/cache/cva6dx_hpdcache_wrapper.sv
      # HPDCache ECC
      - ip/hpdcache/rtl/src/utils/ecc/prim_secded_pkg.sv
      - ip/hpdcache/rtl/src/utils/ecc/prim_secded_36_29_dec.sv
      - ip/hpdcache/rtl/src/utils/ecc/prim_secded_36_29_enc.sv
      - ip/hpdcache/rtl/src/utils/ecc/prim_secded_39_32_dec.sv
      - ip/hpdcache/rtl/src/utils/ecc/prim_secded_39_32_enc.sv
      - ip/hpdcache/rtl/src/utils/ecc/prim_secded_55_48_dec.sv
      - ip/hpdcache/rtl/src/utils/ecc/prim_secded_55_48_enc.sv
      - ip/hpdcache/rtl/src/utils/ecc/prim_secded_72_64_dec.sv
      - ip/hpdcache/rtl/src/utils/ecc/prim_secded_72_64_enc.sv
      # HPDCache SRAM models
      - ip/hpdcache/rtl/src/common/macros/behav/hpdcache_sram_1rw.sv
      - ip/hpdcache/rtl/src/common/macros/behav/hpdcache_sram_ecc_1rw.sv
      - ip/hpdcache/rtl/src/common/macros/behav/hpdcache_sram_wbyteenable_1rw.sv
      - ip/hpdcache/rtl/src/common/macros/behav/hpdcache_sram_wbyteenable_ecc_1rw.sv
      - ip/hpdcache/rtl/src/common/macros/behav/hpdcache_sram_wmask_1rw.sv
      - ip/hpdcache/rtl/src/common/macros/behav/hpdcache_sram_wmask_ecc_1rw.sv

      # Physical Memory Protection
      - design/mmu/cva6dx_pmp.sv
      - design/mmu/cva6dx_pmp_entry.sv
      - design/mmu/cva6dx_pmp_data_if.sv

      - include_dirs:
        - common/local/util
        files:
          - common/local/util/sram.sv

      - target: not(all(fpga, xilinx))
        include_dirs:
          - common/local/util
        files:
          - common/local/util/tc_sram_wrapper.sv
          - common/local/util/sram_cache.sv
          - common/local/util/tc_sram_wrapper_cache_techno.sv

      - target: all(fpga, xilinx)
        include_dirs:
          - common/local/util
        files:
          - common/local/util/sram_cache.sv
          - common/local/util/tc_sram_fpga_wrapper.sv
          - vendor/pulp-platform/fpga-support/rtl/SyncSpRamBeNx64.sv

      - target: not(synthesis)
        include_dirs:
          - design/include
          - common/local/util
        files:
          # Tracer (behavioral code, not RTL)
          - design/include/cva6dx_instr_tracer_pkg.sv
          - common/local/util/instr_tracer.sv
